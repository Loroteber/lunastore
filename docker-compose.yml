services:
    redis:
        image: redis:7-alpine
        restart: always
        command: redis-server --appendonly no
        networks:
            - storenetwork
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        volumes:
            - redis_data:/data

    clickhouse:
        image: clickhouse/clickhouse-server:26.3.17.110
        profiles: ["analytics"]
        restart: unless-stopped
        networks:
            - storenetwork
        environment:
            CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-lunastore_analytics}
            CLICKHOUSE_USER: ${CLICKHOUSE_USER:-analytics}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics}
            CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        volumes:
            - clickhouse_data:/var/lib/clickhouse
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    db:
        image: postgres:18-alpine
        container_name: lunastore_db
        restart: unless-stopped
        env_file:
            - .env
        environment:
            POSTGRES_DB: ${DB_NAME:-lunastore}
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            PGDATA: /var/lib/postgresql/data/pgdata
        networks:
            - storenetwork
        volumes:
            - pg_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-lunastore}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    meilisearch:
        image: getmeili/meilisearch:v1.53
        restart: unless-stopped
        networks:
            - storenetwork
        environment:
            MEILI_ENV: production
            MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
            # Allows in-place DB upgrade when the Meilisearch image version changes.
            MEILI_UPGRADE_DB: "true"
        volumes:
            - meili_data:/meili_data
        healthcheck:
            test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:7700/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 120s

    lunaspire:
        build: ./lunaspire/
        image: lunaspire:local
        env_file:
            - ./lunaspire/.env
        restart: unless-stopped
        networks:
            - storenetwork
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - ./lunaspire/public:/root/public
            - ./lunaspire/storage:/root/storage
        ports:
            - "6080:8080"
        command: >
            sh -c "./main"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s

    x-lunastore-template: &lunastore_base
        image: lunastore:local
        env_file:
            - .env
        restart: unless-stopped
        networks:
            - storenetwork
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            lunaspire:
                condition: service_healthy
            meilisearch:
                condition: service_healthy
        volumes:
            - static_volume:/app/static
            - /opt/lunastore/media:/app/media
            - /opt/lunastore/certs:/app/certs:ro
        command: >
            sh -c "python manage.py collectstatic --noinput &&
                   DJANGO_ROOT_URLCONF=lunastore.urls_api      gunicorn lunastore.wsgi:application --bind 0.0.0.0:7088 --workers 5 &
                   DJANGO_ROOT_URLCONF=lunastore.urls_private  gunicorn lunastore.wsgi:application --bind 0.0.0.0:8088 --workers 5 &
                   DJANGO_ROOT_URLCONF=lunastore.urls          gunicorn lunastore.wsgi:application --bind 0.0.0.0:9088 --workers 5 &
                   wait"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fs http://localhost:7088/method/service/heartbeat/ && curl -fs http://localhost:8088/${ADMIN_URL:-admin}/login/ && curl -fs http://localhost:9088/ || exit 1",
                ]
            interval: 10s
            retries: 3
            start_period: 60s

    lunastore-blue:
        <<: *lunastore_base
        container_name: lunastore_blue
        ports:
            - "7081:7088" # API
            - "8081:8088" # Admin
            - "9081:9088" # Web

    lunastore-green:
        <<: *lunastore_base
        container_name: lunastore_green
        ports:
            - "7082:7088"
            - "8082:8088"
            - "9082:9088"

    lunastore-worker:
        image: lunastore:local
        container_name: lunastore_worker
        restart: unless-stopped
        networks:
            - storenetwork
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            lunaspire:
                condition: service_healthy
        volumes:
            - /opt/lunastore/media:/app/media
            - /opt/lunastore/certs:/app/certs:ro
        command: python manage.py run_tasks_worker --continuous --interval 1.0

networks:
    storenetwork:
        name: lunastore_network
        driver: bridge

volumes:
    static_volume:
    media_volume:
    pg_data:
    redis_data:
    clickhouse_data:
    meili_data:
