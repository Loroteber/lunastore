# THIS DOCKER-COMPOSE.YML ONLY FOR DEVELOPMENT
# DO NOT USE IT IN PROD, PLEASE ~_~

services:
    redis:
        image: redis:7-alpine
        restart: always
        command: redis-server --appendonly yes
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        volumes:
            - redis_data:/data
        ports:
            - "6379:6379"

    clickhouse:
        image: clickhouse/clickhouse-server:26.3.17.110
        profiles: ["analytics"]
        restart: unless-stopped
        environment:
            CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-lunastore_analytics}
            CLICKHOUSE_USER: ${CLICKHOUSE_USER:-analytics}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics}
            CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
            - "8123:8123"
            - "9000:9000"
        volumes:
            - clickhouse_data:/var/lib/clickhouse
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    meilisearch:
        image: getmeili/meilisearch:v1.53
        restart: unless-stopped
        environment:
            MEILI_ENV: development
            MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
            # Allows in-place DB upgrade when the Meilisearch image version changes.
            MEILI_UPGRADE_DB: "true"
        volumes:
            - meili_data:/meili_data
        ports:
            - "7700:7700"
        healthcheck:
            test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:7700/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s

    db:
        image: postgres:18-alpine
        container_name: lunastore_db
        environment:
            POSTGRES_DB: ${DB_NAME:-lunastore_dev}
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
            PGDATA: /var/lib/postgresql/data/pgdata
        ports:
            - "5432:5432"
        volumes:
            - pg_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-lunastore}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    lunaspire:
        build: ./lunaspire/
        image: lunaspire:local
        env_file:
            - ./lunaspire/.env
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - ./lunaspire/public:/root/public
            - ./lunaspire/storage:/root/storage
        ports:
            - "6080:8080"
        command: >
            sh -c "./main"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s

    admin:
        build: .
        container_name: lunastore_admin
        command: python manage.py runserver 0.0.0.0:8088 --nostatic
        environment:
            DJANGO_ROOT_URLCONF: lunastore.urls_private
        ports:
            - "8088:8088"
        depends_on:
            db:
                condition: service_healthy
            meilisearch:
                condition: service_healthy
        env_file:
            - .env
        volumes:
            - .:/app
            - static_volume:/app/staticfiles_build
            - ./media:/root/lunastore/media

    web:
        build: .
        container_name: lunastore_web
        command: python manage.py runserver 0.0.0.0:9088 --nostatic
        env_file:
            - .env
        ports:
            - "9088:9088"
        depends_on:
            db:
                condition: service_healthy
            meilisearch:
                condition: service_healthy
        volumes:
            - .:/app
            - static_volume:/app/staticfiles_build
            - ./media:/root/lunastore/media

    api:
        build: .
        container_name: lunastore_api
        command: python manage.py runserver 0.0.0.0:7088
        environment:
            DJANGO_ROOT_URLCONF: lunastore.urls_api
        env_file:
            - .env
        ports:
            - "7088:7088"
        depends_on:
            db:
                condition: service_healthy
            meilisearch:
                condition: service_healthy
        volumes:
            - .:/app
            - static_volume:/app/staticfiles_build
            - ./media:/root/lunastore/media

    worker:
        build: .
        container_name: lunastore_worker
        command: python manage.py run_tasks_worker --continuous --interval 1.0
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - .:/app
            - ./media:/root/lunastore/media

volumes:
    static_volume:
    media_volume:
    pg_data:
    redis_data:
    clickhouse_data:
    meili_data:
